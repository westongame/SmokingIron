modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="cgm_banner.png"
authors="MrCrayfish"
description="MrCrayfish's Gun Mod adds in simple and straight forward weapons into Minecraft."

[[mixins]]
config="cgm.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# TODO: Framework dependency (verify version for NeoForge 1.21.1)
#[[dependencies.${mod_id}]]
#    modId="framework"
#    type="required"
#    versionRange="[0.13.18,)"
#    ordering="BEFORE"
#    side="BOTH"

[[dependencies.${mod_id}]]
    modId="jei"
    type="optional"
    versionRange="[19.0,)"
    ordering="AFTER"
    side="CLIENT"

[modproperties.${mod_id}]
    catalogueImageIcon="cgm_icon.png"
    catalogueBackground="cgm_background.png"
    configuredBackground="minecraft:textures/block/stone_bricks.png"
